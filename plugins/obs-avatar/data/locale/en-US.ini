Avatar.StageInfo="Audio is taken after that source's own filters, so lip sync follows the voice that is actually streamed (AudioShift included). With lip sync off, the artwork is drawn as a still or looping image - an animated GIF or WebP works as an idle loop. For an animal or cartoon avatar pick the mouth-deformation mode, which needs nothing but the picture. For a real person's photo pick the MuseTalk worker: the plugin starts it for you and restarts it if it dies. Its output goes to logs/avatar-worker.log next to the OBS log. Turn automatic start off to run the worker yourself against the pipe shown below; see tools/musetalk-sidecar/README.md."
