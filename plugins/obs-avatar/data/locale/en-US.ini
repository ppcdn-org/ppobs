Avatar.Mouth.Hint="MuseTalk cannot drive an animal face - its preprocessing needs human face detection - so this mode opens a jaw on the artwork instead, and you have to say where the mouth is. Easiest way: right-click the source, choose Interact, then drag onto the mouth and use the scroll wheel to size it. The green outline shows the region being deformed. This gives a jaw that opens in time with speech, not distinct vowel shapes."
