Avatar.StageInfo="Audio is taken after that source's own filters, so lip sync follows the voice that is actually streamed (AudioShift included). With lip sync off, the artwork is drawn as a still or looping image - an animated GIF or WebP works as an idle loop. Switched on, the plugin waits for a worker process on the pipe shown below; see tools/musetalk-sidecar/README.md. Animal and cartoon avatars need the sprite mode, which is not built yet."
