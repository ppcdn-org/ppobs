Avatar.StageInfo="取的是该音频源经过自身滤镜之后的音频，所以口型对的是实际推出去的声音（包含 AudioShift 变声）。口型驱动关闭时，头像按静态图或循环动图绘制，动图（GIF / WebP）可直接当 idle 循环用。动物或卡通头像选「张嘴变形」，除了这张图什么都不需要。真人照片选「MuseTalk worker」：插件会替你启动 worker，崩溃后自动重启，它的输出写在 OBS 日志旁边的 logs/avatar-worker.log。想自己手动跑 worker 时，关掉「自动启动」，再对着下面显示的管道启动，用法见 tools/musetalk-sidecar/README.md。"
